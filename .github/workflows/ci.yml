name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页面手动触发一次

jobs:
  backend:
    name: 后端 vet + build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        # 关键：go.mod 在 server/ 目录下，不在仓库根目录，
        # 所以所有 run 步骤都必须以 server/ 作为工作目录，否则会找不到 go.mod
        working-directory: server
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go（版本直接取自 server/go.mod 的 go 指令）
        uses: actions/setup-go@v5
        with:
          # 注意：这两个路径是相对仓库根目录的，不受上面的 working-directory 影响
          # 若某个补丁版本拉取失败，可改成 go-version: '1.26.x'
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 静态检查（go vet）
        run: go vet ./...

      - name: 编译（go build）
        run: go build ./...

      - name: 单元测试（-race 顺带检测数据竞争）
        run: go test -race -v ./...

  # ---------------------------------------------------------------------------
